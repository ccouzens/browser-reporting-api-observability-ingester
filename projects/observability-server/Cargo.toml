[package]
name = "observability-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
color-eyre = { version = "0.6.5", default-features = false }
jiff = { version = "0.2.46", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }
url = { version = "2.5.8", features = ["serde"] }
user-agent-classifier = "0.1.6"
walkdir = "2.5.0"
yoke = { version = "0.8.4", features = ["derive"] }
